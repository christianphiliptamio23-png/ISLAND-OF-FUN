<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Island HUD — transparent PNG assets</title><style>html,body{margin:0;height:100%;background:#152d36;color:#fff;font-family:system-ui}main{width:min(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;position:relative;margin:auto;background:linear-gradient(135deg,#355b60,#192d3c);overflow:hidden}img.hud{position:absolute;user-select:none;-webkit-user-drag:none}p{margin:0;padding:1rem;text-align:center;font-size:14px}</style><main id="game"></main><p>Transparent cutouts only. Replace the demo gradient with your game canvas. The island map is intentionally excluded.</p><script>fetch('layout.json').then(r=>r.json()).then(({assets})=>{for(const [name,v] of Object.entries(assets)){if(name==='emote_wheel_choices')continue;const img=document.createElement('img');img.className='hud';img.alt=name;img.src=v.file;img.style.left=v.position[0]+'%';img.style.top=v.position[1]+'%';img.style.width=v.size[0]+'%';img.style.height=v.size[1]+'%';img.draggable=false;document.querySelector('#game').append(img)}})</script></html>
