const tx=(s,x,y,sz,c,al,st)=>{ctx.font='bold '+sz+'px '+FONT;ctx.textAlign=al||'center';ctx.textBaseline='middle';if(st){ctx.lineWidth=st[1];ctx.strokeStyle=st[0];ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=c;ctx.fillText(s,x,y)};

 palm(60,640,1.2,1);palm(150,660,.9,-1);palm(1220,640,1.2,-1);palm(1130,660,.9,1);

 for(const x of[180,1040]){g.fillStyle='#1aa5a0';g.fillRect(x,60,60,660);g.fillStyle='#37c9c0';g.fillRect(x+6,60,10,660);g.fillStyle='#0d6a6e';g.fillRect(x+50,60,10,660)}

 for(let i=0;i<17;i++){const x=i*80;g.fillStyle=i%2?'#fbeed2':'#e8472f';g.fillRect(x,0,80,80);g.beginPath();g.arc(x+40,80,40,0,P);g.fill()}});

// Use the supplied local artwork without changing target coordinates or rules.

function drawBackground(){ctx.drawImage(backdropReady()?backdrop:bg,0,0,W,H)}

/* ---------- state ---------- */
let scr='title',S=null,B=[],mx=640,my=300,lastShot=-1e3,now=0,prev=0,ang=0,rec=0,fl=0,sc=1;
/* Difficulty ramp: every level multiplies base speeds by 1+0.06*levelIndex (L10 = x1.54); pop-up windows shrink a little. */
const SPEEDUP=i=>1+.06*i;
const TARGET_SPEED=1.35; // Targets move 35% faster; cover speed stays unchanged.
/* Extra blockers added on top of each level's own X list (K(x,y,w,h,slideAmplitude,slideSpeed,phase)) */
const EXTRA=[[],
[K(640,290,70,90)],
[K(640,185,70,84),K(640,515,70,84)],
[K(415,360,60,80),K(715,300,60,80),K(865,430,60,80)],

[K(640,440,70,80,200,50),K(640,330,60,90,150,55,2)]];
function mkLevel(i){const L=LV[i],f=SPEEDUP(i),targetFactor=f*TARGET_SPEED;return{lv:i,hits:0,ammo:L.a,goal:L.g,t:0,shots:0,over:0,win:0,endIn:0,fx:[],bk:(L.X||[]).concat(EXTRA[i]||[]).map(k=>({...k,v:k.v*Math.min(f,1.3),cx:k.x})),tg:L.T.map((o,j)=>{const s={...o,v:o.v*targetFactor,i:j,rt:0,p:[0,0]};if(s.m==='p'){s.ex=Math.max(1.3,s.ex/Math.sqrt(targetFactor));s.hw=s.hw/Math.sqrt(targetFactor)}s.p=pos(s,0);return s})}}
function pos(s,t){const w=s.v/(s.A||1);switch(s.m){
 case'h':return[s.cx+s.A*SIN(w*t+s.ph),s.cy];
 case'v':return[s.cx,s.cy+s.A*SIN(w*t+s.ph)];
 case'e':{const q=s.v/Math.max(s.A,s.B)*t+s.ph;return[s.cx+s.A*SIN(q),s.cy+s.B*COS(q)]}
 case'w':{const q=s.v/Math.hypot(s.A,2*s.B)*t+s.ph;return[s.cx+s.A*SIN(q),s.cy+s.B*SIN(2*q)]}
 case'b':return[s.cx+22*SIN(1.2*t+s.ph),640-(((t+s.o)*s.v)%520)];
 default:{const Pd=s.hw+1.4+s.ex,u=(t+s.o)%Pd,lo=s.clip+s.r,hi=s.clip-s.r-6,a=s.hw,b=a+.7,c=b+s.ex;let y;
  if(u<a)y=lo;else if(u<b)y=lo+(hi-lo)*ease((u-a)/.7);else if(u<c)y=hi;else y=hi+(lo-hi)*ease((u-c)/.7);

function inside(s,x,y){if(s.clip&&y>=s.clip)return false;const dx=x-s.p[0],dy=y-s.p[1];
