<style>

<script id="core" type="text/plain">
/* ===== CHESS CORE + ENGINE (runs on main thread for rules and inside a Web Worker for search) ===== */
const PR=['','q','r','b','n'],CR=new Array(128).fill(15);CR[0]=13;CR[7]=14;CR[4]=12;CR[112]=7;CR[119]=11;CR[116]=3;
const KN=[33,31,18,14,-33,-31,-18,-14],BD=[17,15,-17,-15],RD=[16,-16,1,-1],KD=BD.concat(RD);
const ELO=[1100,1250,1400,1550,1700,1850,2000,2150,2300,2500];
/* level settings: d=max depth, ms=time cap, mg=random pick among moves within mg centipawns, rn=chance of a random move, q=quiescence */
const LV=[{d:1,ms:200,mg:220,rn:.12,q:0},{d:1,ms:200,mg:140,rn:.05,q:0},{d:2,ms:300,mg:100,rn:.02,q:1},{d:2,ms:400,mg:60,rn:0,q:1},{d:3,ms:500,mg:40,rn:0,q:1},
{d:3,ms:700,mg:15,rn:0,q:1},{d:4,ms:900,mg:0,rn:0,q:1},{d:6,ms:1300,mg:0,rn:0,q:1},{d:7,ms:2000,mg:0,rn:0,q:1},{d:9,ms:3000,mg:0,rn:0,q:1}];
const HINTC={d:5,ms:700,mg:0,rn:0,q:1};
function Pos(){this.b=new Array(128).fill('');this.t='w';this.c=15;this.ep=-1;this.hm=0;this.fm=1;this.u=[];this.k=[-1,-1]}
const sqn=s=>'abcdefgh'[s&7]+((s>>4)+1);
const mstr=m=>sqn(m&255)+sqn(m>>8&255)+((m>>16&15)?PR[m>>16&15]:'');
Pos.prototype.att=function(s,by){const b=this.b,w=by==='w';let q;
 if(w){q=s-15;if(!(q&136)&&b[q]==='P')return true;q=s-17;if(!(q&136)&&b[q]==='P')return true}
 else{q=s+15;if(!(q&136)&&b[q]==='p')return true;q=s+17;if(!(q&136)&&b[q]==='p')return true}
 const n=w?'N':'n',k=w?'K':'k',bi=w?'B':'b',r=w?'R':'r',qq=w?'Q':'q';
 for(const d of KN){q=s+d;if(!(q&136)&&b[q]===n)return true}
 for(const d of KD){q=s+d;if(!(q&136)&&b[q]===k)return true}
 for(const d of BD){q=s+d;while(!(q&136)){const p=b[q];if(p!==''){if(p===bi||p===qq)return true;break}q+=d}}
 for(const d of RD){q=s+d;while(!(q&136)){const p=b[q];if(p!==''){if(p===r||p===qq)return true;break}q+=d}}
 return false};
Pos.prototype.gen=function(caps){const b=this.b,w=this.t==='w',mv=[];
 for(let s=0;s<120;s++){if(s&136)continue;const p=b[s];if(p===''||(p<'a')!==w)continue;const lp=p.toLowerCase();
  if(lp==='p'){const d=w?16:-16,r=s>>4,pr=w?6:1,st=w?1:6;let t=s+d;
   if(b[t]===''){if(r===pr){for(let i=1;i<5;i++)mv.push(s|t<<8|i<<16)}else if(!caps){mv.push(s|t<<8);if(r===st&&b[t+d]==='')mv.push(s|(t+d)<<8|4<<20)}}
   for(const e of [d-1,d+1]){t=s+e;if(t&136)continue;const q=b[t];
    if(q!==''&&(q<'a')!==w){if(r===pr)for(let i=1;i<5;i++)mv.push(s|t<<8|i<<16);else mv.push(s|t<<8)}else if(q===''&&t===this.ep)mv.push(s|t<<8|1<<20)}}
  else if(lp==='n'||lp==='k'){for(const d of lp==='n'?KN:KD){const t=s+d;if(t&136)continue;const q=b[t];if(q===''){if(!caps)mv.push(s|t<<8)}else if((q<'a')!==w)mv.push(s|t<<8)}}
  else{const D=lp==='b'?BD:lp==='r'?RD:KD;for(const d of D){let t=s+d;while(!(t&136)){const q=b[t];if(q===''){if(!caps)mv.push(s|t<<8)}else{if((q<'a')!==w)mv.push(s|t<<8);break}t+=d}}}}
 if(!caps){const e=w?'b':'w';
  if(w){if((this.c&1)&&b[4]==='K'&&b[7]==='R'&&b[5]===''&&b[6]===''&&!this.att(4,e)&&!this.att(5,e)&&!this.att(6,e))mv.push(4|6<<8|2<<20);
   if((this.c&2)&&b[4]==='K'&&b[0]==='R'&&b[1]===''&&b[2]===''&&b[3]===''&&!this.att(4,e)&&!this.att(3,e)&&!this.att(2,e))mv.push(4|2<<8|2<<20)}
  else{if((this.c&4)&&b[116]==='k'&&b[119]==='r'&&b[117]===''&&b[118]===''&&!this.att(116,e)&&!this.att(117,e)&&!this.att(118,e))mv.push(116|118<<8|2<<20);
   if((this.c&8)&&b[116]==='k'&&b[112]==='r'&&b[113]===''&&b[114]===''&&b[115]===''&&!this.att(116,e)&&!this.att(115,e)&&!this.att(114,e))mv.push(116|114<<8|2<<20)}}
 return mv};
Pos.prototype.make=function(m){const b=this.b,f=m&255,t=m>>8&255,pr=m>>16&15,fl=m>>20,p=b[f],w=this.t==='w';
 const U={m,cap:b[t],c:this.c,ep:this.ep,hm:this.hm,fm:this.fm};this.u.push(U);b[t]=p;b[f]='';
 if(fl&1){const cs=t+(w?-16:16);U.cap=b[cs];b[cs]=''}
 if(pr)b[t]=w?PR[pr].toUpperCase():PR[pr];
 if(fl&2){if(t>f){b[t-1]=b[t+1];b[t+1]=''}else{b[t+1]=b[t-2];b[t-2]=''}}
 if(p==='K')this.k[0]=t;else if(p==='k')this.k[1]=t;
 this.c&=CR[f]&CR[t];this.ep=(fl&4)?(f+t)>>1:-1;this.hm=(p==='P'||p==='p'||U.cap!=='')?0:this.hm+1;if(!w)this.fm++;this.t=w?'b':'w'};
Pos.prototype.unmake=function(){const U=this.u.pop(),m=U.m,b=this.b,f=m&255,t=m>>8&255,pr=m>>16&15,fl=m>>20;this.t=this.t==='w'?'b':'w';const w=this.t==='w';
 let p=b[t];if(pr)p=w?'P':'p';b[f]=p;
 if(fl&1){b[t]='';b[t+(w?-16:16)]=U.cap}else b[t]=U.cap;
 if(fl&2){if(t>f){b[t+1]=b[t-1];b[t-1]=''}else{b[t-2]=b[t+1];b[t+1]=''}}
 if(p==='K')this.k[0]=f;else if(p==='k')this.k[1]=f;
 this.c=U.c;this.ep=U.ep;this.hm=U.hm;this.fm=U.fm};
const bad=P=>P.att(P.k[P.t==='w'?1:0],P.t);
Pos.prototype.legal=function(){const r=[];for(const m of this.gen()){this.make(m);if(!bad(this))r.push(m);this.unmake()}return r};

 P.ep=(!a[3]||a[3]==='-')?-1:(a[3].charCodeAt(0)-97)+(a[3][1]-1)*16;P.hm=+a[4]||0;P.fm=+a[5]||1;return P}

 else{const cap=P.b[t]!==''||(fl&1);
  if(lp==='p'){s=cap?'abcdefgh'[f&7]+'x':'';s+=sqn(t);if(pr)s+='='+PR[pr].toUpperCase()}
  else{s=p.toUpperCase();const am=L.filter(x=>x!==m&&(x>>8&255)===t&&P.b[x&255]===p);
   if(am.length){const sf=am.some(x=>(x&7)===(f&7)),sr=am.some(x=>((x&255)>>4)===(f>>4));if(!sf)s+='abcdefgh'[f&7];else if(!sr)s+=(f>>4)+1;else s+=sqn(f)}
   if(cap)s+='x';s+=sqn(t)}}

<script>

function exit(){const f=window.ChessGame.onExit;if(typeof f==='function')f();else if(parent!==window)parent.postMessage({type:'chess:exit'},location.origin);else location.assign('/game.html?play=1')}
function showLevels(){if(G){G.over=true;G.tok++;Eng.cancel();clearInterval(tmr)}$('#wrap').hidden=true;$('#ov').hidden=true;$('#lvl').hidden=false;buildLevels()}
function buildLevels(){const ic=['\u265F','\u265C','\u265E','\u265D','\u265B'];$('#gd').innerHTML=ELO.map((e,i)=>`<button class="cd${cfg.lvl===i+1?' on':''}" data-l="${i+1}"><span class="ic">${i===9?'\u265A':ic[i%5]}\uFE0E</span>Level ${i+1}<small>${e} Elo</small><span class="economy-level-label">${window.GameEconomy?.label(i+1)||''}</span></button>`).join('');
 document.querySelectorAll('#sd button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.side));$('#en').textContent='Approximate engine ratings \u2022 '+Eng.label()}
/* ---------- events ---------- */
$('#gd').onclick=e=>{const b=e.target.closest('[data-l]');if(b){cfg.lvl=+b.dataset.l;store();buildLevels()}};
$('#sd').onclick=e=>{const b=e.target.closest('[data-v]');if(b){cfg.side=b.dataset.v;store();buildLevels()}};
$('#go').onclick=newGame;$('#bk').onclick=exit;$('#cl').onclick=showLevels;$('#ng').onclick=newGame;
$('#sn').onclick=()=>{cfg.snd=!cfg.snd;store();$('#sn').innerHTML=cfg.snd?'\u{1F50A}':'\u{1F507}'};$('#sn').innerHTML=cfg.snd?'\u{1F50A}':'\u{1F507}';
$('#fp').onclick=()=>{if(G){G.flip=!G.flip;buildBoardLabels();render()}};
$('#rs').onclick=()=>{if(G&&!G.over&&confirm('Resign this game?'))finish('loss','You resigned')};
$('#hn').onclick=()=>{if(!G||!canPlay())return;const id=++G.tok;G.busy=true;upd();Eng.think(toFEN(G.pos),cfg.lvl,true).then(u=>{if(id!==G.tok||G.over)return;G.busy=false;
 const m=G.pos.legal().find(x=>mstr(x)===u);if(m)G.hint=[m&255,m>>8&255];render()})};
$('#un').onclick=()=>window.GameEconomy?.retry();
$('#side').onclick=e=>{if(!G)return;const n=e.target.closest('[data-n]'),m=e.target.closest('[data-p]'),last=G.snaps.length-1;
 if(n){const k=n.dataset.n;G.view=k==='f'?0:k==='l'?last:Math.max(0,Math.min(last,G.view+(k==='n'?1:-1)))}else if(m&&m.dataset.p<=last)G.view=+m.dataset.p;else return;G.sel=-1;G.targets=[];render()};
$('#ov').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;const r=b.dataset.r;if(r==='again')newGame();else if(r==='lvl')showLevels();else exit()});
$('#st').onclick=()=>{$('#ov').hidden=false;$('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').hidden=true};
 $('#ov').innerHTML=`<div class="card"><h2>Settings</h2><label>Time control<select id="stc">${TC.map((t,i)=>`<option value="${i}"${cfg.tc===i?' selected':''}>${t[2]}</option>`).join('')}</select></label>
 <label>Show legal moves<input type="checkbox" id="slm"${cfg.legal?' checked':''}></label><label>Sound<input type="checkbox" id="ssd"${cfg.snd?' checked':''}></label>
 <p style="font-size:.85em">Time control applies to the next game.<br>${Eng.label()}</p><button class="bt grn" id="sok" style="font-size:1em">Done</button></div>`;
 $('#sok').onclick=()=>{cfg.tc=+$('#stc').value;cfg.legal=$('#slm').checked;cfg.snd=$('#ssd').checked;store();$('#ov').hidden=true;$('#sn').innerHTML=cfg.snd?'\u{1F50A}':'\u{1F507}';if(G&&!$('#wrap').hidden)render()}};
/* board input: click-to-move and drag */
const bd=$('#board');
function sqAt(e){const r=bd.getBoundingClientRect(),c=Math.floor((e.clientX-r.left)/r.width*8),rw=Math.floor((e.clientY-r.top)/r.height*8);if(c<0||c>7||rw<0||rw>7)return-1;return(G.flip?rw:7-rw)*16+(G.flip?7-c:c)}
bd.addEventListener('pointerdown',e=>{if(!G||!canPlay())return;e.preventDefault();const s=sqAt(e);if(s<0)return;const p=G.pos.b[s],mine=p&&((p<'a')===(G.color==='w'));
 if(mine){const same=G.sel===s;G.sel=s;G.targets=legalFrom(s);G.hint=null;drag={sq:s,x:e.clientX,y:e.clientY,on:false,same};render()}
 else if(G.sel>=0&&G.targets.some(m=>(m>>8&255)===s)){tryMove(G.sel,s)}else{G.sel=-1;G.targets=[];render()}});
addEventListener('pointermove',e=>{if(!drag)return;if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){drag.on=true;const p=G.pos.b[drag.sq],g=$('#gh');g.hidden=false;g.className='pc '+(p<'a'?'pw':'pb');g.textContent=gl(p.toUpperCase());render()}
 if(drag.on){const g=$('#gh');g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'}});
addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;$('#gh').hidden=true;
 if(d.on){const s=sqAt(e);if(s>=0&&s!==d.sq&&G.targets.some(m=>(m>>8&255)===s)){drag={on:true};tryMove(d.sq,s);drag=null;return}render()}
 else if(d.same){G.sel=-1;G.targets=[];render()}});
Eng.init().then(()=>{if(!$('#lvl').hidden)buildLevels()});
$('#lvl').hidden=false;buildLevels();
window.addEventListener('economy-ready',()=>window.GameEconomy.register({start:n=>{cfg.lvl=n;newGame();},unlockNative:()=>{if(window.GameEconomy.isLocked(cfg.lvl))cfg.lvl=1;buildLevels()}}));
})();
</script>
</body></html>
