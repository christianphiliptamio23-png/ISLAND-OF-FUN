 for(const b of S.bodies)drawBody(b);
 if(S.ball){S.trail.forEach((t,i)=>{ctx.fillStyle=`rgba(255,200,80,${i/S.trail.length*.5})`;ctx.beginPath();ctx.arc(t[0],t[1],BR*i/S.trail.length,0,2*P);ctx.fill()});ctx.save();ctx.translate(S.ball.position.x,S.ball.position.y);ctx.rotate(S.ball.angle);ballAt(0,0);ctx.restore()}
 else if(drag)ballAt(drag.x,drag.y);else if(S.ph==='aim'||S.ph==='look')ballAt(AX,AY);
 sling(1);
 for(const p of S.parts){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,2*P);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}

 ctx.fillStyle='rgba(0,0,0,.3)';rr(x,y+6,w,h,16);ctx.fill();const q=ctx.createLinearGradient(0,y,0,y+h);q.addColorStop(0,dis?'#8a8f94':c1);q.addColorStop(1,dis?'#5d6267':c2);ctx.fillStyle=q;rr(x,y-(hov?2:0),w,h,16);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();tx(t,x+w/2,y+h/2-(hov?2:0),Math.min(30,h*.52),'#fff',null,['rgba(0,0,0,.35)',5])}

 btn('← Back',14,10,120,52,()=>{scr='pause'},RED[0],RED[1]);p(150,190,'LEVEL '+(S.lv+1)+' / 10');p(356,250,'SCORE '+S.score);
 ctx.fillStyle='#6b3f1d';ctx.strokeStyle='#3d220d';ctx.lineWidth=4;rr(622,12,40+S.total*34,48,12);ctx.fill();ctx.stroke();for(let i=0;i<S.total;i++){ctx.globalAlpha=i<S.balls?1:.25;ctx.fillStyle='#ffb02e';ctx.beginPath();ctx.arc(650+i*34,36,12,0,2*P);ctx.fill();ctx.strokeStyle=NV;ctx.lineWidth=3;ctx.stroke()}ctx.globalAlpha=1;
 tx('Cans '+S.cans.filter(c=>c.ko).length+'/'+S.cans.length,1030,37,24,'#fff','center',[NV,6]);
 btn('II',1100,10,70,52,()=>{scr='pause'});btn('↻',1184,10,70,52,restart,RED[0],RED[1])}

 if(scr==='title'||scr==='select'||!S){cam=0;bgDraw();ctx.save();ctx.fillStyle='#f3d99a';ctx.fillRect(0,GY,VW,VH-GY);ctx.fillStyle='#5fd06a';ctx.fillRect(0,GY,VW,10);ctx.restore();
  ctx.save();sling(0);ballAt(AX,AY);sling(1);ctx.restore()}
 else{bgDraw();world()}
 if(mstate!=='ok'&&(scr==='play')){}
 if(scr==='title'){tx('CAN',640,130,110,'#ffd23a',null,['#6b1b2c',16]);tx('KNOCKDOWN',640,235,96,'#ff6a4a',null,['#6b1b2c',16]);tx('ISLAND OF FUN',640,320,34,'#fff',null,['#0c4d52',8]);
  btn('Play',490,370,300,70,()=>start(Math.min(save.u,10)-1),GRN[0],GRN[1]);btn('Level Select',490,456,300,64,()=>{scr='select'});btn('Sound: '+(save.snd?'ON':'OFF'),490,538,300,56,()=>{save.snd=save.snd?0:1;store()},GLD[0],GLD[1]);
  if(mstate==='loading')tx('Loading physics…',640,650,24,'#fff');else if(mstate==='fail')tx('Could not load Matter.js: put matter.min.js next to this file.',640,650,22,'#ffd0d0',null,['#400',5])}
 else if(scr==='select'){ctx.fillStyle='rgba(8,30,40,.72)';ctx.fillRect(160,70,960,580);tx('Select Level',640,120,46,'#fff36b',null,['#0c4d52',8]);
  for(let i=0;i<10;i++){const x=205+(i%5)*180,y=175+Math.floor(i/5)*190,ok=i<save.u,st=save.st[i]||0;btn(String(i+1),x,y,150,130,()=>start(i),st?'#ffd23a':'#37c9c0',st?'#d98200':'#127a72',!ok);
   if(!ok)tx('LOCKED',x+75,y+100,16,'#fff');else for(let k=0;k<3;k++){star(x+37+k*38,y+100,13);ctx.fillStyle=k<st?'#fff':'rgba(0,0,0,.3)';ctx.fill()}}
  btn('Back',540,560,200,60,()=>{scr='title'},RED[0],RED[1])}
 else if(S){hud();

  if(scr==='play'&&S.lv===0&&S.balls===S.total&&!drag&&S.intro<=0)tx('Drag the ball back and release to shoot!',640,640,26,'#fff',null,['#0c4d52',6]);
  if(scr==='pause'){panel(500,440,'Paused','#127a72');btn('Resume',490,265,300,58,()=>{scr='play'},GRN[0],GRN[1]);btn('Restart',490,335,300,58,restart,RED[0],RED[1]);btn('Level Select',490,405,300,58,()=>{scr='select'});btn('Back to Island',490,475,300,58,exitGame,GLD[0],GLD[1])}
  else if(scr==='win'){panel(560,380,'Level Clear!','#2f9a3a');for(let k=0;k<3;k++){star(540+k*100,300+(k===1?-10:0),k===1?44:36);ctx.fillStyle=k<S.stars?'#ffd23a':'rgba(0,0,0,.25)';ctx.fill();ctx.strokeStyle='#6b3f1d';ctx.lineWidth=5;ctx.stroke()}
   tx('Score '+S.score,640,368,30,'#4a2c12');btn(S.lv<9?'Next Level':'Level Select',490,400,300,64,()=>S.lv<9?start(S.lv+1):(scr='select'),GRN[0],GRN[1]);btn('Retry',490,478,140,52,restart,RED[0],RED[1]);btn('Levels',650,478,140,52,()=>{scr='select'})}

 if(scr==='play'&&S&&S.ph==='look'&&S.pt<1.9)tx('Knock down these cans!  (tap to skip)',640,262,26,'#fff',null,['#0c4d52',6])}
function start(i){if(mstate!=='ok'||i+1>save.u)return;loadLevel(i)}
/* ---------- input ---------- */
function setP(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*VW;my=(e.clientY-r.top)/r.height*VH}
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();setP(e);
 const b=B.find(b=>!b.dis&&mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h);if(b){snd('click');b.fn();return}
 if(scr==='play'&&S&&S.ph==='look'){S.pt=Math.max(S.pt,1.9);return}
 if(scr==='play'&&S&&S.ph==='aim'&&cam<40&&Math.hypot(mx+cam-AX,my-AY)<120){drag={x:AX,y:AY};try{cv.setPointerCapture(e.pointerId)}catch(_){}moveDrag()}});
function moveDrag(){if(!drag)return;let dx=mx+cam-AX,dy=my-AY;const d=Math.hypot(dx,dy);if(d>MAXD){dx*=MAXD/d;dy*=MAXD/d}drag.x=AX+dx;drag.y=Math.min(AY+dy,GY-BR-4)}
cv.addEventListener('pointermove',e=>{setP(e);moveDrag()});
function up(e){if(!drag)return;setP(e);moveDrag();if(Math.hypot(drag.x-AX,drag.y-AY)>22&&S&&S.ph==='aim'&&scr==='play')launch();else drag=null}

window.addEventListener('resize',fit);fit();
